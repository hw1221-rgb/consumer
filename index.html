<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>스마슈머의 방탈출 게임</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 20px;
      color: #effff7;
      background: radial-gradient(ellipse at 50% 25%, #174439, #091512 72%);
      font-family: system-ui, "Malgun Gothic", sans-serif;
    }
    main {
      width: min(100%, 640px);
      padding: clamp(32px, 8vw, 76px) 20px;
      text-align: center;
      background: #10251f;
      border: 1px solid #497064;
      border-radius: 24px;
      box-shadow: 0 24px 70px #0006;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.9rem, 7vw, 3.65rem);
      line-height: 1.15;
      letter-spacing: -.055em;
    }
    h1 span { display: block; color: #9df5b9; }
    p {
      margin: 20px 0 32px;
      color: #c5ded4;
      line-height: 1.6;
      word-break: keep-all;
    }
    button {
      width: min(100%, 240px);
      min-height: 52px;
      padding: 12px 24px;
      border: 0;
      border-radius: 12px;
      background: #9df5b9;
      color: #10251f;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button:hover { background: #c2ffd4; }
    button:focus-visible { outline: 3px solid white; outline-offset: 5px; }
    [hidden] { display: none !important; }
    h2 { margin-top: 0; word-break: keep-all; }
    .status { color: #9df5b9; font-weight: 700; }
    form { display: grid; justify-items: center; gap: 12px; }
    input { max-width: 100%; padding: 12px; border-radius: 8px; font: inherit; }
    #choices { display: grid; gap: 10px; }
    #choices button { width: 100%; background: #d8ede5; text-align: left; }
    #choices button:hover { background: #b6efcb; }
    #choices button:disabled { opacity: .55; cursor: default; }
    #case { text-align: left; padding: 16px; background: #19372d; border-radius: 12px; margin: 16px 0; }
    #feedback { min-height: 3.2em; margin: 16px 0; }
    .table-wrap { overflow-x: auto; margin: 16px 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #497064; padding: 10px 6px; }
    td:nth-child(2) { overflow-wrap: anywhere; }
    th { white-space: nowrap; }
    #home > button, #results > button { margin-top: 12px; }
    body {
      background: repeating-linear-gradient(0deg, #ffffff08 0 1px, transparent 1px 32px),
                  repeating-linear-gradient(90deg, #ffffff08 0 1px, transparent 1px 32px),
                  radial-gradient(ellipse at 50% 10%, #294371, #0b1120 72%);
      color: #f7f4eb;
    }
    main { position: relative; background: #111d32; border-color: #4e6081; padding-top: 76px; }
    h1 span, .status { color: #ffda83; }
    #case { background: #263550; border-left: 4px solid #ffda83; color: #f7f4eb; }
    button { background: #ffda83; color: #162137; }
    button:hover { background: #ffeab8; }
    #choices button { background: #e7edfb; }
    #choices button:hover { background: #fff0ce; }
    #sound { position: absolute; top: 14px; right: 14px; width: auto; min-height: 42px;
             padding: 8px 14px; background: #293a59; color: #f7f4eb; }
    progress { width: min(100%, 300px); accent-color: #ffda83; margin-top: 12px; }
    #game > p:not(#case):not(#feedback) { margin: 10px 0 16px; }
    .scene {
      display: flex; justify-content: center; align-items: center; gap: 18px;
      min-height: 116px; border-radius: 18px; margin: 12px 0;
      background: radial-gradient(ellipse at 50% 100%, #455e90, #18243d 72%);
      border: 1px solid #52678d; font-size: 3.25rem;
    }
    #scene-prop { font-size: 2rem; transform: rotate(12deg); }
    .mascot { display: grid; place-items: center; width: 52px; height: 52px;
              border-radius: 50%; background: #3b2f4f; font-size: 2rem; }
    .hero { margin: 0 auto 16px; width: 84px; height: 84px; font-size: 3.2rem; }
    .guide { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: start;
             text-align: left; padding: 12px; border-radius: 14px; background: #202d48; }
    #hint-button { width: auto; min-height: 44px; padding: 8px 14px; }
    #hint-text { margin-top: 10px; line-height: 1.55; word-break: keep-all; }
  </style>
</head>
<body>
  <main>
    <button id="sound" type="button" aria-pressed="true">음향 켜짐</button>
    <section id="home">
      <div class="mascot hero" aria-hidden="true">🦊</div>
      <h1>스마슈머의 <span>방탈출 게임</span></h1>
      <p>아홉 개의 소비 사건을 조사하고, 사건마다 세 개의 잠금장치를 푸세요.</p>
      <form id="entry">
        <label for="player">학번 또는 별명</label>
        <input id="player" maxlength="20" required autocomplete="off">
        <button type="submit">시작</button>
      </form>
      <button id="show-records" type="button">순위 보기</button>
    </section>

    <section id="game" hidden>
      <div id="progress" class="status"></div>
      <progress id="locks" max="3" value="0" aria-label="이 사건에서 푼 문항"></progress>
      <p>경과 시간 <time id="timer">0:00</time></p>
      <h2 id="case-title" tabindex="-1"></h2>
      <div class="scene" aria-hidden="true"><span id="scene-art"></span><span id="scene-prop"></span></div>
      <p id="case"></p>
      <div class="guide">
        <span class="mascot" aria-hidden="true">🦊</span>
        <div>
          <button id="hint-button" type="button" aria-expanded="false" aria-controls="hint-text">루미 탐정의 힌트</button>
          <div id="hint-text" hidden></div>
        </div>
      </div>
      <h3 id="question"></h3>
      <div id="choices" role="group" aria-labelledby="question"></div>
      <p id="feedback" role="status"></p>
      <button id="next" type="button" hidden>다음 문제</button>
    </section>

    <section id="results" hidden>
      <h2 id="result-title" tabindex="-1">탈출 순위</h2>
      <p id="result-summary" hidden></p>
      <p id="storage-status" role="status" hidden></p>
      <div class="table-wrap">
        <table>
          <thead><tr><th scope="col">순위</th><th scope="col">학생</th><th scope="col">정답률</th><th scope="col">탈출 시간</th><th scope="col">완료 순서</th></tr></thead>
          <tbody id="records"></tbody>
        </table>
      </div>
      <p>첫 시도 정답률이 높은 순으로, 같으면 탈출 시간이 짧은 순으로 정렬합니다. 둘 다 같으면 먼저 완료한 학생이 앞섭니다.</p>
      <button id="back" type="button">첫 화면으로</button>
    </section>
  </main>

      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;

    function playSound(notes) {
      if (!soundOn) return;
      try {
        const Audio = window.AudioContext || window.webkitAudioContext;
        if (!Audio) return;
        audio ??= new Audio();
        if (audio.state === 'suspended') audio.resume().catch(() => {});
        const start = audio.currentTime;
        notes.forEach((frequency, index) => {
          const tone = audio.createOscillator();
          const volume = audio.createGain();
          const time = start + index * .12;
          tone.type = 'triangle';
          tone.frequency.value = frequency;
          volume.gain.setValueAtTime(.001, time);
          volume.gain.exponentialRampToValueAtTime(.12, time + .02);
          volume.gain.exponentialRampToValueAtTime(.001, time + .18);
          tone.connect(volume).connect(audio.destination);
          tone.start(time);
          tone.stop(time + .19);
        });
      } catch {
        // 오디오를 사용할 수 없는 환경에서도 게임은 진행됩니다.

      return Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
    };
    const timeLabel = ms => duration(ms) + '.' + String(ms % 1000).padStart(3, '0');
    const accuracy = count => Math.round(count * 100 / total) + '%';

    function show(screen) {
      for (const id of ['home', 'game', 'results']) el(id).hidden = id !== screen;
    }

      el('timer').textContent = duration(performance.now() - game.started);

      const question = questions[game.index];

    function answerQuestion(question, option, button) {
      if (option !== question.answer) {
        playSound([220, 165]);

        if (nextChoice) nextChoice.focus();
        button.disabled = true;
        return;
      }

    el('back').addEventListener('click', () => {
      show('home');
      el('entry').reset();
      el('player').focus();
    });
  </script>
</body>
</html>
