<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>스마슈머의 방탈출 게임</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 20px;
      color: #effff7;
      background: radial-gradient(ellipse at 50% 25%, #174439, #091512 72%);
      font-family: system-ui, "Malgun Gothic", sans-serif;
    }
    main {
      width: min(100%, 640px);
      padding: clamp(32px, 8vw, 76px) 20px;
      text-align: center;
      background: #10251f;
      border: 1px solid #497064;
      border-radius: 24px;
      box-shadow: 0 24px 70px #0006;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.9rem, 7vw, 3.65rem);
      line-height: 1.15;
      letter-spacing: -.055em;
    }
    h1 span { display: block; color: #9df5b9; }
    p {
      margin: 20px 0 32px;
      color: #c5ded4;
      line-height: 1.6;
      word-break: keep-all;
    }
    button {
      width: min(100%, 240px);
      min-height: 52px;
      padding: 12px 24px;
      border: 0;
      border-radius: 12px;
      background: #9df5b9;
      color: #10251f;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button:hover { background: #c2ffd4; }
    button:focus-visible { outline: 3px solid white; outline-offset: 5px; }
    [hidden] { display: none !important; }
    h2 { margin-top: 0; word-break: keep-all; }
    .status { color: #9df5b9; font-weight: 700; }
    form { display: grid; justify-items: center; gap: 12px; }
    input { max-width: 100%; padding: 12px; border-radius: 8px; font: inherit; }
    #choices { display: grid; gap: 10px; }
    #choices button { width: 100%; background: #d8ede5; text-align: left; }
    #choices button:hover { background: #b6efcb; }
    #choices button:disabled { opacity: .55; cursor: default; }
    #feedback { min-height: 3.2em; margin: 16px 0; }
    .table-wrap { overflow-x: auto; margin: 16px 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #497064; padding: 10px 6px; }
    td:nth-child(2) { overflow-wrap: anywhere; }
    th { white-space: nowrap; }
    #home > button, #results > button { margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <section id="home">
      <h1>스마슈머의 <span>방탈출 게임</span></h1>
      <p>소비자 문제를 풀고 세 개의 잠금장치를 열어 탈출하세요.</p>
      <form id="entry">
        <label for="player">학번 또는 별명</label>
        <input id="player" maxlength="20" required autocomplete="off">
        <button type="submit">시작</button>
      </form>
      <button id="show-records" type="button">순위 보기</button>
    </section>

    <section id="game" hidden>
      <div id="progress" class="status"></div>
      <p>경과 시간 <time id="timer">0:00</time></p>
      <h2 id="question" tabindex="-1"></h2>
      <div id="choices" role="group" aria-labelledby="question"></div>
      <p id="feedback" role="status"></p>
      <button id="next" type="button" hidden>다음 문제</button>
    </section>

    <section id="results" hidden>
      <h2 id="result-title" tabindex="-1">탈출 순위</h2>
      <p id="result-summary" hidden></p>
      <p id="storage-status" role="status" hidden></p>
      <div class="table-wrap">
        <table>
          <thead><tr><th scope="col">순위</th><th scope="col">학생</th><th scope="col">정답률</th><th scope="col">탈출 시간</th><th scope="col">완료 순서</th></tr></thead>
          <tbody id="records"></tbody>
        </table>
      </div>
      <p>첫 시도 정답률이 높은 순으로, 같으면 탈출 시간이 짧은 순으로 정렬합니다. 둘 다 같으면 먼저 완료한 학생이 앞섭니다.</p>
      <button id="back" type="button">첫 화면으로</button>
    </section>
  </main>

  <script>
    // 각 문제의 answer는 보기 배열에서 0부터 시작하는 정답 위치입니다.
    const rooms = [
      { title: '소비자 문제', questions: [
        { prompt: '새로 산 이어폰의 한쪽에서 소리가 나지 않는다. 어떤 문제인가?',
          options: ['상품의 품질 문제', '개인정보 유출 문제', '배송 지연 문제'], answer: 0,
          explanation: '상품이 정상적으로 작동하지 않는 품질 문제입니다.' },
        { prompt: '광고에는 무료 체험이라고 적혀 있었지만, 결제 조건을 알기 어렵게 표시했다. 무엇이 문제인가?',
          options: ['배송 주소가 잘못됐다', '중요한 거래 조건을 알기 어렵게 안내했다', '상품의 색상이 다양하다'], answer: 1,
          explanation: '비용과 결제 조건은 소비자가 구매를 결정하는 데 중요한 정보입니다.' },
        { prompt: '사용 설명서를 따랐는데 전기 주전자의 손잡이가 지나치게 뜨거워 화상을 입었다. 어떤 문제인가?',
          options: ['상품의 디자인 선호 문제', '배송 지연 문제', '상품의 안전 문제'], answer: 2,
          explanation: '정상적으로 사용했는데도 신체에 피해가 발생한 안전 문제입니다.' }
      ] },
      { title: '소비자 권리', questions: [
        { prompt: '식품을 살 때 원재료와 알레르기 유발 성분을 확인할 수 있어야 한다. 어떤 권리와 가장 관련 있는가?',
          options: ['의견을 반영시킬 권리', '알 권리', '단체를 조직하고 활동할 권리'], answer: 1,
          explanation: '상품 선택에 필요한 정보를 제공받는 것은 알 권리와 관련됩니다.' },
        { prompt: '여러 상품의 가격과 성능을 비교해 자신에게 맞는 상품을 고를 수 있어야 한다. 어떤 권리인가?',
          options: ['선택할 권리', '교육을 받을 권리', '피해를 보상받을 권리'], answer: 0,
          explanation: '다양한 상품을 비교하고 구매 여부를 정하는 것은 선택할 권리입니다.' },
        { prompt: '제품 결함으로 피해를 입은 소비자가 적절한 보상을 요구한다. 어떤 권리인가?',
          options: ['안전할 권리', '알 권리', '피해를 보상받을 권리'], answer: 2,
          explanation: '이미 발생한 피해에 대해 보상을 요구하는 상황입니다.' }
      ] },
      { title: '소비자 문제 해결과정', questions: [
        { prompt: '주문한 상품과 다른 상품이 도착했다. 판매자에게 연락하기 전 무엇을 하면 좋은가?',
          options: ['포장과 주문 내역을 모두 버린다', '주문 내역과 실제 상품을 대조하고 사진을 남긴다', '상품을 사용한 뒤 기억에만 의존한다'], answer: 1,
          explanation: '주문 내역과 사진은 어떤 문제가 생겼는지 설명할 근거가 됩니다.' },
        { prompt: '주문 내역과 상품 사진을 확보했다. 판매자에게 어떻게 요청하는 것이 적절한가?',
          options: ['상품 이름만 말하고 답을 기다린다', '해결을 요청하지 않고 상품만 돌려보낸다', '주문 정보와 문제를 설명하고 원하는 해결 방법을 요청한다'], answer: 2,
          explanation: '증거와 함께 문제와 원하는 해결 방법을 구체적으로 전달합니다.' },
        { prompt: '판매자에게 해결을 요청했지만 합의가 되지 않았다. 다음에 할 수 있는 일은?',
          options: ['거래 기록과 연락 내역을 가지고 소비자 상담 기관에 상담을 요청한다', '관련 증거를 모두 삭제한다', '같은 상품을 다시 구매한다'], answer: 0,
          explanation: '사업자와 해결하기 어려울 때는 자료를 갖춰 소비자 상담 기관의 도움을 받을 수 있습니다.' }
      ] }
    ];
    const questions = rooms.flatMap(room =>
      room.questions.map(question => ({ ...question, room: room.title }))
    );
    const el = id => document.getElementById(id);
    const key = 'smart-consumer-escape-records-v1';
    let records = [];
    let storageAvailable = true;
    try {
      records = JSON.parse(localStorage.getItem(key) || '[]');
      if (!Array.isArray(records)) records = [];
    } catch {
      storageAvailable = false;
    }

    let game;
    let ticker;
    const duration = ms => {
      const seconds = Math.floor(ms / 1000);
      return Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
    };
    const timeLabel = ms => duration(ms) + '.' + String(ms % 1000).padStart(3, '0');
    const accuracy = count => Math.round(count * 100 / questions.length) + '%';

    function show(screen) {
      for (const id of ['home', 'game', 'results']) el(id).hidden = id !== screen;
    }

    function tick() {
      el('timer').textContent = duration(performance.now() - game.started);
    }

    function showQuestion() {
      const question = questions[game.index];
      game.attempted = false;
      el('progress').textContent = question.room + ' · ' + (game.index + 1) + ' / ' + questions.length;
      el('question').textContent = question.prompt;
      el('feedback').textContent = '';
      el('next').hidden = true;
      el('choices').replaceChildren();
      question.options.forEach((option, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = option;
        button.addEventListener('click', () => answerQuestion(question, index, button));
        el('choices').append(button);
      });
      el('question').focus();
    }

    function answerQuestion(question, index, button) {
      if (index !== question.answer) {
        game.attempted = true;
        el('feedback').textContent = '아직 잠금이 풀리지 않았어요. 다른 보기를 골라 보세요.';
        const nextChoice = [...el('choices').children].find(choice => choice !== button && !choice.disabled);
        if (nextChoice) nextChoice.focus();
        button.disabled = true;
        return;
      }
      if (!game.attempted) game.correct++;
      const last = game.index === questions.length - 1;
      if (last) {
        const elapsed = Math.round(performance.now() - game.started);
        clearInterval(ticker);
        el('timer').textContent = timeLabel(elapsed);
        game.result = { player: game.player, correct: game.correct, elapsed, order: records.length + 1 };
        records.push(game.result);
        try {
          localStorage.setItem(key, JSON.stringify(records));
          storageAvailable = true;
        } catch {
          storageAvailable = false;
        }
      }
      el('feedback').textContent = '정답! ' + question.explanation;
      el('next').textContent = last ? '탈출 결과 보기' : '다음 문제';
      el('next').hidden = false;
      el('next').focus();
      for (const choice of el('choices').children) choice.disabled = true;
    }

    function showResults(result) {
      el('result-title').textContent = result ? '탈출 성공!' : '탈출 순위';
      el('result-summary').hidden = !result;
      if (result) {
        el('result-summary').textContent = result.player + ' · 첫 시도 ' + result.correct + '/' +
          questions.length + '문제 정답 · ' + timeLabel(result.elapsed);
      }
      el('storage-status').hidden = storageAvailable;
      el('storage-status').textContent = storageAvailable ? '' :
        '브라우저에 기록을 저장할 수 없어 현재 열린 화면에서만 순위를 볼 수 있습니다.';
      const rows = el('records');
      rows.replaceChildren();
      const ranked = [...records].sort((a, b) => b.correct - a.correct || a.elapsed - b.elapsed || a.order - b.order);
      ranked.forEach((record, index) => {
        const row = rows.insertRow();
        for (const value of [index + 1, record.player, accuracy(record.correct), timeLabel(record.elapsed), record.order]) {
          row.insertCell().textContent = value;
        }
      });
      if (!ranked.length) {
        const cell = rows.insertRow().insertCell();
        cell.colSpan = 5;
        cell.textContent = '아직 탈출 기록이 없습니다.';
      }
      show('results');
      el('result-title').focus();
    }

    el('entry').addEventListener('submit', event => {
      event.preventDefault();
      const player = el('player').value.trim();
      if (!player) {
        el('player').value = '';
        el('player').reportValidity();
        return;
      }
      game = { player, index: 0, correct: 0, started: performance.now() };
      show('game');
      tick();
      showQuestion();
      ticker = setInterval(tick, 200);
    });

    el('next').addEventListener('click', () => {
      if (game.result) {
        showResults(game.result);
      } else {
        game.index++;
        showQuestion();
      }
    });
    el('show-records').addEventListener('click', () => showResults());
    el('back').addEventListener('click', () => {
      show('home');
      el('entry').reset();
      el('player').focus();
    });
  </script>
</body>
</html>
